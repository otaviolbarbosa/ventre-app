<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ventre — Sem conexão</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--primary:12 55% 48%;--background:25 40% 97%;--foreground:15 20% 22%;--muted-foreground:15 10% 46%;--accent:18 50% 90%;--secondary-foreground:10 30% 30%}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:hsl(var(--background));font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:hsl(var(--foreground));display:flex;flex-direction:column;align-items:center;justify-content:center;padding:64px 24px;position:relative;overflow:hidden}
.tex{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.05;pointer-events:none;user-select:none}
.wm{position:absolute;top:36px;height:26px;width:auto}
@media(min-width:640px){.wm{height:30px}}
.ring{position:relative;width:190px;height:190px;display:flex;align-items:center;justify-content:center;margin-top:24px}
.ring svg{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg)}
.code{font:700 76px/1 Poppins,system-ui;color:#78130A;opacity:.12;letter-spacing:-.04em;user-select:none}
@media(min-width:640px){.ring{width:260px;height:260px}.code{font-size:104px}}
.body{position:relative;width:100%;max-width:480px;text-align:center;margin-top:24px}
h1{margin:0 0 10px;font:600 23px/1.25 Poppins,system-ui;letter-spacing:-.02em}
@media(min-width:640px){h1{font-size:28px}}
p{margin:0 0 24px;font:14px/1.55 system-ui,sans-serif;color:hsl(var(--muted-foreground));text-wrap:pretty}
@media(min-width:640px){p{font-size:15px}}
.ctas{display:flex;flex-direction:column;gap:10px;justify-content:center}
@media(min-width:640px){.ctas{flex-direction:row}}
.btn{display:inline-flex;align-items:center;justify-content:center;height:44px;padding:0 22px;border:0;border-radius:9999px;font:600 14px Poppins,system-ui;cursor:pointer;text-decoration:none;transition:filter .2s,background .2s}
.btn-primary{background:linear-gradient(135deg,hsl(12 55% 48%),#78130A);color:#fff;box-shadow:0 4px 14px -4px hsl(12 55% 48% / .45)}
.btn-primary:hover{filter:brightness(1.06)}
.btn-ghost{background:transparent;color:hsl(var(--foreground))}
.btn-ghost:hover{background:hsl(12 55% 48% / .08)}
.support{margin-top:20px;display:inline-flex;align-items:center;gap:7px;font:500 13px system-ui,sans-serif;color:hsl(var(--muted-foreground));text-decoration:none}
.support:hover{color:hsl(var(--foreground))}
.pill{display:inline-flex;align-items:center;gap:8px;padding:6px 14px;border-radius:9999px;background:hsl(var(--accent));font:500 12.5px system-ui,sans-serif;color:hsl(var(--secondary-foreground));margin:-14px 0 22px}
.dot{width:7px;height:7px;border-radius:50%;background:hsl(var(--primary));animation:pulseDot 1.4s ease-in-out infinite}
@keyframes pulseDot{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.35;transform:scale(.8)}}
@keyframes fu{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes drawArc{from{stroke-dashoffset:741}to{stroke-dashoffset:237}}
.fu1{animation:fu .65s cubic-bezier(.22,1,.36,1) both}
.fu2{animation:fu .65s cubic-bezier(.22,1,.36,1) .15s both}
.fu3{animation:fu .65s cubic-bezier(.22,1,.36,1) .3s both}
.arc{stroke-dasharray:741;animation:drawArc 1.6s cubic-bezier(.22,1,.36,1) .2s both}
</style></head>
<body>
<img class="tex" src="../assets/bg-fingerprint2.png" alt="">
<img class="wm fu1" src="../assets/ventre.png" alt="Ventre">
<div class="ring fu1">
  <svg viewBox="0 0 260 260" aria-hidden="true">
    <circle cx="130" cy="130" r="118" fill="none" stroke="hsl(12 55% 48% / .1)" stroke-width="4"></circle>
    <circle class="arc" cx="130" cy="130" r="118" fill="none" stroke="hsl(var(--primary))" stroke-width="4" stroke-linecap="round"></circle>
  </svg>
  <div class="code">OFF</div>
</div>
<div class="body fu2">
  <h1>Você está sem conexão</h1>
  <p>Estamos tentando reconectar. Seus dados continuam salvos.</p>
  <div class="pill"><span class="dot"></span>Reconectando… tentativa 1</div>
  <div class="ctas fu3">
    <a class="btn btn-primary" href="#">Tentar agora</a>
    <a class="btn btn-ghost" href="#">Ir para o início</a>
  </div>
  <a class="support fu3" href="#"><svg viewBox="0 0 24 24" width="15" height="15" fill="currentColor" aria-hidden="true"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"></path></svg>Falar com suporte</a>
</div>
</body></html>
